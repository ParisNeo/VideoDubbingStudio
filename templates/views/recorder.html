<div id="view-recorder" class="view-section" style="display: none;">
    <header><h1>Voice Recorder</h1></header>
    <div class="recorder-container">
        <div class="visualizer-box">
            <canvas id="audio-visualizer"></canvas>
            <div id="timer-display">00:00</div>
        </div>
        <div class="controls">
            <button id="rec-start-btn" class="btn-record"><i class="fas fa-microphone"></i></button>
            <button id="rec-stop-btn" class="btn-stop" disabled><i class="fas fa-stop"></i></button>
        </div>
        <div id="recordings-list" class="recordings-list"></div>
    </div>
</div>
