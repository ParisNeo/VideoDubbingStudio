<div id="view-dashboard" class="view-section">
    <header>
        <div class="header-row">
            <div>
                <h1>Project Dashboard</h1>
                <p class="subtitle">Manage and monitor your video dubbing projects. Interrupted tasks can be resumed after app restart.</p>
            </div>
            <button id="refresh-dash-btn" class="btn-icon" title="Refresh">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </header>
    <div id="task-grid" class="task-grid">
        <div class="empty-state">
            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 16px;"></i>
            <p>Loading tasks...</p>
        </div>
    </div>
</div>
